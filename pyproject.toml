[project]
name = "intelliner"
version = "1.0.0"
description = "中文智能实体识别系统 - Chinese NER with Hybrid Intelligence"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "transformers>=4.33.0,<4.50.0",
    "torch>=2.2.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "modelscope>=1.40.1",
    "addict>=2.4.0",
    "simplejson>=4.2.0",
    "sortedcontainers>=2.4.0",
    "pillow>=12.3.0",
    "opencv-python-headless>=5.0.0.93",
    "datasets>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
]

[tool.uv]
package = false
